{% extends 'base.html' %}

{% block title %}Daftar Akun Baru — LinuxAcademy LMS{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card" style="max-width: 520px;">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h2 class="auth-title">Daftar Akun Baru</h2>
            <p class="auth-subtitle">Mulai perjalanan belajar sistem operasi Linux dan dapatkan sertifikat resmi.</p>
        </div>

        <form method="POST" action="/register" class="auth-form">
            <input type="hidden" name="role" value="siswa">

            <div class="form-group">
                <label for="fullname" class="form-label">Nama Lengkap *</label>
                <div class="input-with-icon">
                    <i class="bi bi-card-text"></i>
                    <input type="text" id="fullname" name="fullname" class="form-input" placeholder="Nama yang akan tertera di sertifikat" required>
                </div>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username *</label>
                <div class="input-with-icon">
                    <i class="bi bi-at"></i>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Huruf kecil tanpa spasi (misal: budi_linux)" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Alamat Email (Opsional)</label>
                <div class="input-with-icon">
                    <i class="bi bi-envelope-fill"></i>
                    <input type="email" id="email" name="email" class="form-input" placeholder="nama@contoh.com">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="password" class="form-label">Kata Sandi *</label>
                    <div class="input-with-icon">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Min. 4 karakter" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Konfirmasi Sandi *</label>
                    <div class="input-with-icon">
                        <i class="bi bi-shield-check"></i>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Ulangi kata sandi" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="padding: 10px; font-size: 15px; margin-top: 10px;">
                <i class="bi bi-check-circle-fill"></i> Selesaikan Pendaftaran
            </button>
        </form>

        <div class="auth-footer">
            Sudah memiliki akun? <a href="/login" class="auth-link">Masuk ke Sini</a>
        </div>
    </div>
</div>


{% endblock %}
